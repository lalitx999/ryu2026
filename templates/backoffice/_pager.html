{% if page.paginator.num_pages > 1 %}
<nav class="mt-3 d-flex justify-content-between align-items-center small"><span class="text-secondary">หน้า {{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }} รายการ</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ qs }}page={{ page.previous_page_number }}">ก่อนหน้า</a></li>{% endif %}
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ qs }}page={{ page.next_page_number }}">ถัดไป</a></li>{% endif %}
  </ul></nav>{% endif %}
