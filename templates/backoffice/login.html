{% load static %}<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | RyuClass</title>
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}"><link rel="stylesheet" href="{% static 'css/admin.css' %}"></head>
<body class="admin-body d-flex align-items-center justify-content-center p-3">
<div class="adm-card p-4 w-100" style="max-width:380px">
  <div class="text-center mb-3"><img src="{% static 'assets/ryu_logo.jpg' %}" alt="" width="56" height="56" class="rounded-circle border mb-2"><h1 class="h5 fw-bold mb-0">เข้าสู่ระบบ Admin Portal</h1><div class="small text-secondary">เข้าสู่ระบบสำหรับผู้ดูแลระบบและทีมงาน RyuClass</div></div>
  <div id="msg" class="alert alert-danger py-2 small d-none"></div>
  <form id="f" class="d-flex flex-column gap-3">
    <div><label class="form-label small fw-semibold">อีเมลผู้ดูแลระบบ (Admin Email)</label><input class="form-control" type="email" name="email" required autocomplete="username"></div>
    <div><label class="form-label small fw-semibold">รหัสผ่าน</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-dark" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script><script src="{% static 'js/ajax.js' %}"></script>
<script>document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var m=document.getElementById('msg');m.classList.add('d-none');
try{var r=await Ryu.ajax.post('/admin-panel/api/login/',Object.fromEntries(new FormData(this).entries()));location.href=r.data.next;}catch(err){m.textContent=err.message;m.classList.remove('d-none');}});</script>
</body></html>
